# .github/workflows/feed-sync.yml
#
# Runs the BinMaster and BarnTools syncs, and the doForms inventory snapshot, every 15 minutes (Vercel's free
# plan only allows one Cron run a day). Each call does the same thing the
# daily Vercel cron does: it pulls fresh sensor readings and stores them.
# The inventory step records any change in a group's head count (a sale) with a
# timestamp, so the Feed Logistics page knows how many pigs were in each barn each day.
# The AP sync is left on its daily Vercel cron -- it reads emailed reports,
# so running it more often would not bring in anything new.

name: Feed sensor sync

on:
  schedule:
    - cron: "7,22,37,52 * * * *"      # every 15 minutes (UTC)
  workflow_dispatch: {}          # lets you press "Run workflow" to test it

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the sync endpoints
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          fail=0
          for ep in binmaster-sync barntools-sync 'inventory-data?snapshot=1'; do
            echo "== $ep"
            if ! curl -fsS -m 60 --retry 2 --retry-delay 5 \
                 -H "Authorization: Bearer ${CRON_SECRET}" \
                 "https://doforms-backend.vercel.app/api/$ep"; then
              echo "FAILED: $ep"; fail=1
            fi
            echo
          done
          exit $fail
